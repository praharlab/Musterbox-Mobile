buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-bootsplash 7 declares its Kotlin sources as Java dirs only; with AGP 9 the
// Kotlin compiler then sees no sources and RNBootSplash is missing. Register them for Kotlin.
subprojects { sub ->
    if (sub.name == 'react-native-bootsplash') {
        sub.afterEvaluate {
            def arch = sub.findProperty('newArchEnabled') == 'true' ? 'src/newarch' : 'src/oldarch'
            sub.android.sourceSets.main.kotlin.srcDirs += ['src/main/java', arch]
        }
    }
}
